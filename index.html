<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Nipa Racing – videosoitin</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#9fb3c4;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
.msg{height:100%;display:grid;place-items:center;text-align:center;padding:1.5rem;box-sizing:border-box}
.msg b{display:block;color:#fff;font-size:1.15rem;margin-bottom:.3rem}
</style>
</head>
<body>
<script>
/* Nipa Racing Pit Wall – video player relay page.
   A page opened from a local file (the offline demo) cannot tell YouTube / Twitch which site embeds the video, so they
   refuse the embed (YouTube "error 153"). This page is hosted on a normal https (or http) address and embeds the
   video itself, so the players see this page as the embedding site. Only YouTube video / channel ids and Twitch
   channel / video ids are accepted – the page cannot be used to frame arbitrary sites.
   Parameters: v=<YouTube video id> | ch=<YouTube channel id UC…> | tw=<Twitch channel> | twv=<Twitch video id>, sound=1 */
(function () {
  var q = new URLSearchParams(location.search), mute = q.get('sound') === '1' ? 0 : 1, o = location.origin, src = '';
  var v = q.get('v') || '', ch = q.get('ch') || '', tw = q.get('tw') || '', twv = q.get('twv') || '';
  var who = /^https?:$/.test(location.protocol) ? '&origin=' + encodeURIComponent(o) + '&widget_referrer=' + encodeURIComponent(o + '/') : '';
  if (/^[\w-]{6,20}$/.test(v)) src = 'https://www.youtube.com/embed/' + v + '?autoplay=1&mute=' + mute + '&playsinline=1&rel=0&modestbranding=1' + who;
  else if (/^UC[\w-]{10,40}$/.test(ch)) src = 'https://www.youtube.com/embed/live_stream?channel=' + ch + '&autoplay=1&mute=' + mute + '&playsinline=1' + who;
  else if (/^\w{2,40}$/.test(tw)) src = 'https://player.twitch.tv/?channel=' + tw + '&parent=' + location.hostname + '&autoplay=true&muted=' + (mute ? 'true' : 'false');
  else if (/^\d{4,15}$/.test(twv)) src = 'https://player.twitch.tv/?video=' + twv + '&parent=' + location.hostname + '&autoplay=true&muted=' + (mute ? 'true' : 'false');
  if (!src) { document.body.innerHTML = '<div class="msg"><div><b>Nipa Racing – videosoitin</b>Soitinsivu toimii. Pit Wall avaa tämän sivun automaattisesti, kun striimin osoite on asetettu.</div></div>'; return; }
  var f = document.createElement('iframe'); f.src = src; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true; f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
